services:
  postgres:
    image: postgres:16
    container_name: flowreserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowreserve
      POSTGRES_PASSWORD: flowreserve_password
      POSTGRES_DB: flowreserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: